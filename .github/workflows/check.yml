name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax
        run: |
          node --check dsh-browser-annotation/client.js
          node --check dsh-browser-annotation/index.js

      - name: JSON metadata
        run: |
          node -e "for (const file of ['dsh-browser-annotation/package.json','dsh-browser-annotation/locale/en.json','dsh-browser-annotation/locale/zh.json']) JSON.parse(require('fs').readFileSync(file, 'utf8')); console.log('metadata ok')"
